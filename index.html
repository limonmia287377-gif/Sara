<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Frost Breakout ❄</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02030d;color:#d8faff;font-family:monospace;text-align:center;overflow:hidden}h1{font-size:clamp(23px,6vw,40px);font-weight:400;letter-spacing:3px;margin:12px 0;text-shadow:0 0 12px #28baff}.wrap{position:relative;margin:auto;width:min(96vw,460px);height:min(84dvh,760px);border:2px solid #08aaff;box-shadow:0 0 10px #00aaff,0 0 35px #006cff;background:#000719}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:18px}.overlay.hidden{display:none}button{background:#031d40;color:#b8faff;border:1px solid #20baff;border-radius:6px;box-shadow:0 0 15px #008dff;padding:13px 25px;font:20px monospace;cursor:pointer}.hint{font-size:12px;color:#9ad6ee;margin:8px}
</style></head><body><h1>Frost Breakout ❄</h1><div class="wrap"><canvas id="game"></canvas><div class="overlay" id="overlay"><h2 id="message">FROST BREAKOUT</h2><p id="sub">Move your finger to control the paddle.<br>Break all the ice!</p><button id="start">START GAME</button></div></div><div class="hint">Touch / drag or use ← → · Tap to pause</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),message=document.getElementById('message'),sub=document.getElementById('sub'),start=document.getElementById('start');
const W=420,H=720;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);
let score=0,level=1,lives=3,playing=false,paused=false,bricks=[],particles=[],stars=[],paddle={x:175,y:675,w:70,h:13},ball={x:210,y:655,vx:3,vy:-5,r:7},keys={};let audio;
function beep(freq=500,dur=.06){try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
for(let i=0;i<42;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3});
function setup(){bricks=[];let rows=Math.min(4+level,9),cols=7,gap=3,bw=(W-28-(cols-1)*gap)/cols;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:14+c*(bw+gap),y:52+r*26,w:bw,h:23,on:true,hue:190+r*5});resetBall()}
function resetBall(){paddle.x=W/2-paddle.w/2;ball={x:W/2,y:paddle.y-12,vx:(Math.random()>.5?1:-1)*(2.4+level*.3),vy:-(4.5+level*.3),r:7}}
function begin(){score=0;level=1;lives=3;particles=[];setup();playing=true;paused=false;overlay.classList.add('hidden');beep(650)}
function show(title,detail,btn){playing=false;message.textContent=title;sub.textContent=detail;start.textContent=btn;overlay.classList.remove('hidden')}
start.onclick=begin;
function burst(x,y){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:25})}
function update(){if(!playing||paused)return;if(keys.ArrowLeft||keys.a)paddle.x-=7;if(keys.ArrowRight||keys.d)paddle.x+=7;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);beep(350)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);beep(350)}if(ball.y<ball.r+38){ball.y=ball.r+38;ball.vy=Math.abs(ball.vy)}
if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<paddle.y+paddle.h&&ball.x>=paddle.x-ball.r&&ball.x<=paddle.x+paddle.w+ball.r){ball.y=paddle.y-ball.r;let hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);let speed=Math.min(8.5,Math.hypot(ball.vx,ball.vy)+.06);ball.vx=hit*speed*.85;ball.vy=-Math.sqrt(speed*speed-ball.vx*ball.vx);beep(520)}
for(let b of bricks){if(!b.on)continue;if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.on=false;score+=10;burst(ball.x,ball.y);let ox=Math.min(Math.abs(ball.x-b.x),Math.abs(ball.x-(b.x+b.w))),oy=Math.min(Math.abs(ball.y-b.y),Math.abs(ball.y-(b.y+b.h)));if(ox<oy)ball.vx*=-1;else ball.vy*=-1;beep(650+score%300);break}}
if(ball.y>H+10){lives--;beep(160,.25);if(lives<=0)show('GAME OVER','Final score: '+score,'PLAY AGAIN');else resetBall()}
if(playing&&bricks.every(b=>!b.on)){level++;setup();beep(950,.2)}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});particles=particles.filter(p=>p.life>0)}
function glow(color,blur){ctx.shadowColor=color;ctx.shadowBlur=blur}
function draw(){ctx.fillStyle='#000718';ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle='#5685ac';ctx.globalAlpha=.2+Math.sin(Date.now()*.001+s.x)*.18;ctx.fillRect(s.x,s.y,s.r,s.r)});ctx.globalAlpha=1;
ctx.font='bold 21px monospace';glow('#00dfff',9);ctx.fillStyle='#00ddff';ctx.fillText(String(score).padStart(6,'0'),16,29);ctx.font='bold 12px monospace';ctx.fillText('LVL '+level+'  ❄ '+lives,275,26);ctx.shadowBlur=0;
bricks.forEach(b=>{if(!b.on)return;glow('#008aff',9);let gr=ctx.createLinearGradient(0,b.y,0,b.y+b.h);gr.addColorStop(0,'#69e9ff');gr.addColorStop(.4,'#009dff');gr.addColorStop(1,'#0034ae');ctx.fillStyle=gr;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;ctx.fillStyle='#b8ffff88';ctx.fillRect(b.x+1,b.y+1,b.w-2,2)});
particles.forEach(p=>{ctx.globalAlpha=p.life/25;glow('#2adfff',8);ctx.fillStyle='#9cefff';ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
glow('#00aaff',22);let gr=ctx.createLinearGradient(0,paddle.y,0,paddle.y+paddle.h);gr.addColorStop(0,'#a6ffff');gr.addColorStop(.5,'#00b8ff');gr.addColorStop(1,'#0042bf');ctx.fillStyle=gr;ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.strokeStyle='#8fffff';ctx.strokeRect(paddle.x,paddle.y,paddle.w,paddle.h);
glow('#00baff',25);ctx.fillStyle='#baffff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(paused){ctx.fillStyle='#fff';ctx.font='25px monospace';ctx.fillText('PAUSED',155,370)}requestAnimationFrame(loop)}
function loop(){update();drawFrame()}function drawFrame(){ctx.fillStyle='#000718';ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle='#5685ac';ctx.globalAlpha=.2+Math.sin(Date.now()*.001+s.x)*.18;ctx.fillRect(s.x,s.y,s.r,s.r)});ctx.globalAlpha=1;ctx.font='bold 21px monospace';glow('#00dfff',9);ctx.fillStyle='#00ddff';ctx.fillText(String(score).padStart(6,'0'),16,29);ctx.font='bold 12px monospace';ctx.fillText('LVL '+level+'  ❄ '+lives,275,26);ctx.shadowBlur=0;
bricks.forEach(b=>{if(!b.on)return;glow('#008aff',9);let gr=ctx.createLinearGradient(0,b.y,0,b.y+b.h);gr.addColorStop(0,'#69e9ff');gr.addColorStop(.4,'#009dff');gr.addColorStop(1,'#0034ae');ctx.fillStyle=gr;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;ctx.fillStyle='#b8ffff88';ctx.fillRect(b.x+1,b.y+1,b.w-2,2)});particles.forEach(p=>{ctx.globalAlpha=p.life/25;glow('#2adfff',8);ctx.fillStyle='#9cefff';ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;glow('#00aaff',22);let gr=ctx.createLinearGradient(0,paddle.y,0,paddle.y+paddle.h);gr.addColorStop(0,'#a6ffff');gr.addColorStop(.5,'#00b8ff');gr.addColorStop(1,'#0042bf');ctx.fillStyle=gr;ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.strokeStyle='#8fffff';ctx.strokeRect(paddle.x,paddle.y,paddle.w,paddle.h);glow('#00baff',25);ctx.fillStyle='#baffff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;if(paused){ctx.fillStyle='#fff';ctx.font='25px monospace';ctx.fillText('PAUSED',155,370)}requestAnimationFrame(loop)}
canvas.addEventListener('pointermove',e=>{if(!playing)return;const rect=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-rect.left)*W/rect.width-paddle.w/2))});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&playing)paused=!paused;else if(playing){const r=canvas.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)*W/r.width-paddle.w/2))}});window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&playing)paused=!paused});window.addEventListener('keyup',e=>keys[e.key]=false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)paused=true});setup();requestAnimationFrame(loop);
</script></body></html>
